name: Component Integration Tests in Bazel

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
    types: [opened, ready_for_review, reopened, synchronize]
  schedule:
    - cron: '15 1 * * *' # This runs every day at 1:15 UTC

permissions:
  contents: read

jobs:
  build:
    name: Build Bazel Code
    permissions:
      contents: read
      # Allows bazel.yml to prune replaced cache generations once it supports this.
      actions: write
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@419f87cb66c1a0eb444416ae47c4c97bdc5732fc # bazel/v0.1.0
    with:
      build-targets: //tests/test_scenarios/rust:test_scenarios
      # Nightly runs repeat the component integration tests.
      test-targets: ${{ github.event_name == 'schedule' && '//tests/test_cases:cit_repeat' || '//tests/test_cases:cit' }}
      bazel-configs: x86_64-linux
      test-args: ${{ github.event_name == 'schedule' && '--test_timeout=1200' || '' }}
      cache-key: cit
